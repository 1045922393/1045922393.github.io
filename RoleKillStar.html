<!doctype html>
<html lang="zh-CN">
  <head>

    <title>剧本助手 · 大明星的最后演出</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:

          Arial, sans-serif;
        background: #f5f0eb;
        color: #2c2c2c;
        padding: 16px;

        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      #app {
        max-width: 480px;
        width: 100%;
        background: white;
        border-radius: 28px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        padding: 24px 20px 32px;
        position: relative;
        overflow: hidden;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 2px solid #eee;
        padding-bottom: 12px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .header h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #1e1e1e;
      }
      .header .role-badge {
        background: #e8e0d8;
        padding: 4px 14px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 600;
        color: #4a3f37;
      }
      .header .history-btn {
        background: #d4c9c0;
        border: none;
        border-radius: 30px;
        padding: 4px 14px;
        font-size: 14px;
        font-weight: 600;
        color: #2c2c2c;
        cursor: pointer;
      }
      .header .history-btn:active {
        background: #bfb3a8;
      }
      .content {
        min-height: 400px;
      }
      .card {
        background: #fcf9f7;
        border-radius: 16px;
        padding: 16px 18px;
        margin-bottom: 16px;
        border: 1px solid #eee;
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        color: #4a3f37;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-title .badge {
        background: #d4c9c0;
        color: #2c2c2c;
        font-size: 12px;
        padding: 2px 10px;
        border-radius: 30px;
        font-weight: 400;
      }
      .script-text {
        font-size: 15px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
        color: #333;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .script-text .public-clue {
        background: #f0ebe6;
        border-radius: 12px;
        padding: 14px 16px;
        margin: 10px 0;
        border-left: 4px solid #b8a99b;
        font-family: "Georgia", "Times New Roman", serif;
        color: #2c2c2c;
      }
      .script-text .public-clue strong {
        display: block;
        font-size: 16px;
        margin-bottom: 6px;
      }
      .script-text .public-clue .clue-end {
        text-align: right;
        font-style: italic;
        color: #888;
        margin-top: 8px;
        font-size: 14px;
      }
      .hidden-word-box {
        background: #f0ebe6;
        border-left: 4px solid #b8a99b;
        padding: 12px 14px;
        border-radius: 10px;
        margin: 12px 0;
        font-size: 15px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

        font-weight: 700;
        color: #8b2f2f;
        background: #fff;
        padding: 2px 12px;
        border-radius: 30px;
        border: 1px dashed #b8a99b;
      }
      .hidden-word-box .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn {
        background: #e8e0d8;
        border: none;
        border-radius: 30px;
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 600;
        color: #2c2c2c;
        cursor: pointer;
        transition: background 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-primary {
        background: #1e1e1e;
        color: white;
      }
      .btn-primary:active {
        background: #3a3a3a;
      }
      .btn-secondary {
        background: #d4c9c0;
      }
      .btn-secondary:active {
        background: #bfb3a8;
      }
      .btn-success {
        background: #2d6a4f;
        color: white;
      }
      .btn-success:active {
        background: #1f4d38;
      }
      .btn-block {
        width: 100%;
        justify-content: center;
      }
      .clue-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      .clue-item {
        background: white;
        border: 1.5px solid #ddd;
        border-radius: 30px;
        padding: 6px 16px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.15s;
        user-select: none;
      }
      .clue-item.selected {
        border-color: #1e1e1e;
        background: #1e1e1e;
        color: white;
      }
      .clue-item.disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .clue-item:active {
        transform: scale(0.96);
      }
      .clue-detail {
        background: #f5f0eb;
        border-radius: 12px;
        padding: 14px 16px;
        margin: 10px 0;
        border-left: 4px solid #b8a99b;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .clue-detail strong {
        display: block;
        margin-bottom: 6px;
        font-size: 16px;
      }
      .clue-detail table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        margin: 8px 0;
      }
      .clue-detail th,
      .clue-detail td {
        border: 1px solid #ccc;
        padding: 4px 6px;
        text-align: left;
      }
      .clue-detail th {
        background: #e8e0d8;
        font-weight: 600;
      }
      .action-bar {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .action-bar .btn {
        flex: 1 1 auto;
        min-width: 100px;
      }

        display: flex;
        flex-direction: column;
        gap: 16px;
        margin: 12px 0;
      }
      .role-card {
        background: #fcf9f7;
        border: 2px solid #eee;
        border-radius: 20px;
        padding: 16px 18px;
        cursor: pointer;
        transition:

        text-align: left;

        border-color: #1e1e1e;
        background: #f0ebe6;
      }

        font-size: 18px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .role-card .role-title {
        font-size: 14px;
        font-weight: 400;
        color: #888;
      }

        font-size: 14px;
        line-height: 1.6;
        color: #444;
        max-height: 150px;
        overflow-y: auto;
        margin-top: 8px;
        padding-right: 4px;
        border-top: 1px solid #eee;
        padding-top: 8px;
      }

        width: 4px;
      }
      .role-card .full-desc::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
      }
      .final-section {
        margin-top: 16px;
      }
      .final-section textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #ddd;
        padding: 12px;
        font-size: 15px;
        font-family: inherit;
        resize: vertical;
        min-height: 70px;
      }
      .final-section .label {
        font-weight: 600;
        margin: 12px 0 4px;
        display: block;
      }
      .truth-box {
        background: #f0ebe6;
        border-radius: 16px;
        padding: 16px;
        margin-top: 16px;
        font-size: 15px;
        line-height: 1.7;
        white-space: pre-wrap;
        max-height: 400px;
        overflow-y: auto;
      }
      .hidden-clue-reveal {
        background: #e6f0ea;
        border-radius: 12px;
        padding: 12px 16px;
        margin: 10px 0;
        border-left: 4px solid #2d6a4f;
      }
      .badge-unlocked {
        background: #2d6a4f;
        color: white;
        border-radius: 30px;
        padding: 2px 12px;
        font-size: 12px;
      }
      .footnote {
        font-size: 13px;
        color: #999;
        text-align: center;
        margin-top: 20px;
      }
      .invitation-box {
        background: #fcf9f7;
        border-radius: 16px;
        padding: 20px;
        border: 1px solid #e0d8d0;
        margin: 10px 0;
        font-size: 15px;
        line-height: 1.8;
      }
      .invitation-box strong {
        color: #1e1e1e;
      }
      .common-bg {
        background: #f5f0eb;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 14px;
        color: #555;
        border-left: 4px solid #b8a99b;
      }
      .rules-box {
        background: #fcf9f7;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid #e0d8d0;
        margin: 10px 0;
        font-size: 14px;
        line-height: 1.8;
      }

        margin-top: 12px;
        margin-bottom: 4px;
        color: #1e1e1e;
      }
      .rules-box ul {
        padding-left: 20px;
        margin: 6px 0;
      }
      .rules-box li {
        margin-bottom: 4px;
      }
      .history-modal {
        background: white;
        border-radius: 16px;
        padding: 16px;
        margin: 12px 0;
        border: 1px solid #ddd;
        max-height: 300px;
        overflow-y: auto;
      }
      .history-modal .item {
        padding: 8px 12px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
      }
      .history-modal .item:active {
        background: #f0ebe6;
      }
      .history-modal .item .tag {
        font-size: 12px;
        color: #888;
        background: #eee;
        padding: 2px 8px;
        border-radius: 12px;
      }
      .review-banner {
        background: #f0ebe6;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .review-banner span {
        font-weight: 600;
        color: #4a3f37;
      }
      .clue-item.highlight {
        border-color: #2d6a4f;
        background: #e6f0ea;
      }
      @media (max-width: 400px) {
        #app {
          padding: 16px;
        }
        .header h1 {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h1>🎭 剧本助手</h1>
        <div style="display: flex; gap: 8px; align-items: center">
          <button class="history-btn" onclick="toggleHistory()">📜 历史</button>

      </div>
      <div class="content" id="content"></div>
      <div class="footnote">面对面 · 各自手机 · 合作推理</div>
    </div>
    <script>
      // ========== 辅助函数：格式化持续时间 ==========
      function formatDuration(dur) {
        const m = dur.match(/(\d+)M/);
        const s = dur.match(/(\d+)S/);
        const min = m ? parseInt(m[1]) : 0;
        const sec = s ? parseInt(s[1]) : 0;
        return min + "分" + sec + "秒";
      }

          desc: `线索I 周雄\n\n你在周雄的办公室里见到了他。他很高大，鼓鼓的肌肉撑起了身上的衣服，坐在他的办公椅上显得很霸气。对于你的到来他看起来一点都不意外，莫非他知道些什么？\n\n“周先生，请问你昨晚去过什么地方？”你开门见山的问道。\n\n“你为什么这么问？”他一副饶有兴趣的样子笑着回问道。\n\n“明人不说暗话，昨晚你去了费雪酒店，摄像头都拍下来了。你是去见了李天船吗？”\n\n“你还真直接啊……”他靠到椅背上，用手支着脑袋思考了一下，接着说道：“是的，我是去见了李天船，我们有些生意上的来往。”\n\n“你知道李天船被杀了吗？”\n\n“知道。我感到很遗憾，他是个不错的生意伙伴。”\n\n“你们一起做的是什么生意？”\n\n“这个啊，我们在一些方面上合作，算是上下游企业的关系。”\n\n“能说具体些吗？”他的话勾起了你的兴趣。\n\n他想了想，说道：“具体些告诉你也无妨，我是开赌场的，你知道吧，最赚钱的生意之一。而他负责帮我洗钱，他有个投资公司，叫做‘利源’。”\n\n“啊……”李天船帮你洗钱？“你有点接受不了这个消息。”但李天船不是很讨厌赌博吗，他还做过很多禁赌的宣传。\n\n“哈哈，作为一个大明星，人前一套人后一套是基本的素质吧。”他笑着说道。\n\n“那你昨晚是去找他谈生意的吗？你们谈了些什么？”\n\n“昨天是李天船约我过去的，他貌似是刚签了一份大合同，我们在他的套房里一边喝酒庆祝，一边谈事情。他想要投资成为赌场的老板之一，参与到赌场的经营当中。而我不同意，赌场是我一手建立起来的，我不想别人来干涉我的决策。”\n\n“后来呢？”\n\n“那个大明星好像从不接受拒绝似的，他坚持要入股，还威胁说不再帮我洗钱，而且要动用他的人脉关系打击赌场的生意。哼，他也不想想我是干什么的，竟敢威胁我！”他咬着牙说道。\n\n“所以你一气之下就杀了他？对于你来说搞到枪肯定不是难事。”\n\n“开什么玩笑，我能做到今天的地位就绝对不可能那么冲动，李天船能帮赌场洗钱，是很重要的角色，我可不想他死。我只是‘好好的’跟他分析了一下，如果他想跟我翻脸的话，最后到底是谁更吃亏。结果他气得暴跳如雷，还大声叫嚣着说走着瞧。哈哈，想想他当时的嘴脸我就想笑，明星在生活中也是那么会表演的吗？再说了，我的确是有把枪，但最近借给朋友了，我去酒店的时候身上根本就没有枪。”\n\n“这样啊……”你想了想，问道：“能告诉我你到达和离开酒店的时间吗？”\n\n“我大约是12点多到的酒店，之后直接去了李天船的套房谈生意。我们大约两点左右谈僵了，我离开了他的套房。之后我决定到酒店里的酒吧坐一下，喝几杯，思考一些事情。我可能在酒吧坐了两个小时吧，我不大记得了，之后我就回赌场了。”`,

      // ========== 游戏状态 ==========
      let state = {
        phase: "select", // 'select' | 'invitation' | 'rules' | 'playing' | 'final'
        role: null,
        round: 0,
        selectedClues: [],
        prevSelected: [],
        unlockedMap: {},
        gameOver: false,
        finalAnswer: { killer: "", motive: "", method: "" },
        // 历史记录
        history: [], // 每轮记录 { round, role, unlocked: boolean, selectedClues: [] }
        // 回顾模式
        viewMode: "game", // 'game' | 'review'
        reviewTarget: null, // 'invitation' | 'rules' | 轮次数字(1-7)
        showHistoryModal: false,
      };

      const contentEl = document.getElementById("content");
      const badgeEl = document.getElementById("roleBadge");

      // ========== 核心渲染函数 ==========
      function render() {
        // 如果是回顾模式，渲染回顾内容
        if (state.viewMode === "review") {
          renderReview();
          return;
        }

        // 正常游戏模式
        if (state.phase === "select") {
          renderSelect();
          badgeEl.textContent = "选择角色";
          return;
        }
        if (state.phase === "invitation") {
          renderInvitation();
          badgeEl.textContent =
            state.role === "han" ? "韩伟文 (经纪人)" : "沈曼离 (助理)";
          return;
        }
        if (state.phase === "rules") {
          renderRules();
          badgeEl.textContent =
            state.role === "han" ? "韩伟文 (经纪人)" : "沈曼离 (助理)";
          return;
        }
        if (state.phase === "final" || state.gameOver) {
          if (state.gameOver) {
            renderTruth();
          } else {
            renderFinal();
          }
          badgeEl.textContent = state.role === "han" ? "经纪人" : "助理";
          return;
        }
        // playing
        const roleData = SCRIPTS[state.role];
        if (!roleData) return;
        const roundIndex = state.round;
        if (roundIndex >= roleData.length) {
          state.phase = "final";
          renderFinal();
          badgeEl.textContent = state.role === "han" ? "经纪人" : "助理";
          return;
        }
        const roundInfo = roleData[roundIndex];
        const roleName =
          state.role === "han" ? "韩伟文（经纪人）" : "沈曼离（助理）";
        badgeEl.textContent = roleName;

        let html = `<div class="card"><div class="card-title">第${roundInfo.round}轮 <span class="badge">${roleName}</span></div>`;

        // 显示上一轮线索（持续显示）
        if (state.prevSelected && state.prevSelected.length > 0) {
          html += `<div class="clue-detail"><strong>📌 上一轮调查的线索</strong>`;
          state.prevSelected.forEach((id) => {
            const clue = CLUES[id];
            if (clue) {
              html += `<div style="margin-top:10px;"><strong>${clue.name}</strong><br>${clue.desc}</div>`;
            }
          });
          html += `</div>`;
        }

        html += `<div class="script-text">${roundInfo.script}</div>`;

        if (roundInfo.hiddenWord) {
          const isUnlocked = state.unlockedMap.hasOwnProperty(roundInfo.round);
          html += `<div class="hidden-word-box">🔒 你的隐藏词：<span class="word">${roundInfo.hiddenWord}</span>`;
          if (!isUnlocked) {
            html += `<button class="btn btn-secondary" onclick="triggerHidden(${roundInfo.round})">✅ 对方说出了这个词</button>`;
          } else {
            html += `<span class="badge-unlocked">已解锁隐藏线索</span>`;
          }
          html += `</div>`;
          if (isUnlocked && roundInfo.hiddenClue) {
            html += `<div class="hidden-clue-reveal"><strong>🔎 隐藏线索：</strong><br>${state.unlockedMap[roundInfo.round]}</div>`;
          }
        }

        if (roundInfo.availableClues && roundInfo.availableClues.length > 0) {
          html += `<div style="margin-top:12px;"><div style="font-weight:600;margin-bottom:6px;">选择本轮要调查的线索（${roundInfo.selectCount}条）：</div>`;
          html += `<div class="clue-list" id="clueList">`;
          roundInfo.availableClues.forEach((id) => {
            const clue = CLUES[id];
            if (clue) {
              const selected = state.selectedClues.includes(id);
              html += `<span class="clue-item ${selected ? "selected" : ""}" data-id="${id}" onclick="toggleClue('${id}')">${clue.name}</span>`;
            }
          });
          html += `</div>`;
          html += `<div class="action-bar"><button class="btn btn-primary" onclick="confirmClues()">确认选择并继续</button></div>`;
        } else {
          html += `<div class="action-bar"><button class="btn btn-primary" onclick="nextRound()">继续</button></div>`;
        }

        html += `</div>`;
        contentEl.innerHTML = html;
      }

      // ========== 回顾模式渲染 ==========
      function renderReview() {
        const rawTarget = state.reviewTarget;
        // 将字符串数字（如"1"）转为真正的数字，确保轮次回顾能正确匹配
        let target = rawTarget;
        let roundNum = null;
        if (typeof rawTarget === "string" && /^\d+$/.test(rawTarget)) {
          roundNum = parseInt(rawTarget, 10);
          target = roundNum;
        } else if (typeof rawTarget === "number") {
          roundNum = rawTarget;
        }

        let title = "历史回顾";
        let content = "";

        if (rawTarget === "invitation") {
          title = "📨 邀请函";
          const inv = INVITATIONS[state.role];
          content = `<div class="invitation-box">${inv.replace(/\n/g, "<br>")}</div>`;
        } else if (rawTarget === "rules") {
          title = "📋 游戏规则";
          content = `<div class="rules-box">${GAME_RULES.replace(/\n/g, "<br>")}</div>`;
        } else if (roundNum !== null && roundNum >= 1 && roundNum <= 7) {
          // 查找历史记录中对应轮次的数据
          const historyEntry = state.history.find((h) => h.round === roundNum);
          const roleData = SCRIPTS[state.role];
          const roundInfo = roleData
            ? roleData.find((r) => r.round === roundNum)
            : null;
          if (!roundInfo) {
            content = `<p>未找到第${roundNum}轮数据，请先完成该轮次</p>`;
          } else {
            title = `第${roundNum}轮 回顾`;
            let html = `<div class="script-text">${roundInfo.script}</div>`;
            // 显示该轮是否解锁隐藏词
            const isUnlocked = historyEntry ? historyEntry.unlocked : false;
            if (roundInfo.hiddenWord) {
              html += `<div class="hidden-word-box">🔒 隐藏词：<span class="word">${roundInfo.hiddenWord}</span>`;
              if (isUnlocked) {
                html += `<span class="badge-unlocked">已解锁</span>`;
              } else {
                html += `<span style="color:#888;">未解锁</span>`;
              }
              html += `</div>`;
              if (isUnlocked && roundInfo.hiddenClue) {
                html += `<div class="hidden-clue-reveal"><strong>🔎 隐藏线索：</strong><br>${roundInfo.hiddenClue}</div>`;
              }
            }
            // 显示该轮选择的线索
            const selectedIds = historyEntry ? historyEntry.selectedClues : [];
            if (selectedIds.length > 0) {
              html += `<div class="clue-detail"><strong>📌 该轮选择的线索</strong>`;
              selectedIds.forEach((id) => {
                const clue = CLUES[id];
                if (clue) {
                  html += `<div style="margin-top:10px;"><strong>${clue.name}</strong><br>${clue.desc}</div>`;
                }
              });
              html += `</div>`;
            } else {
              html += `<p style="color:#888;">该轮未选择任何线索</p>`;
            }
            content = html;
          }
        } else {
          content = `<p>无效的回顾目标</p>`;
        }

        // 构建回顾页面
        let html = `
            <div class="review-banner">
                <span>📜 ${title}</span>
                <button class="btn btn-secondary" onclick="exitReview()">返回游戏</button>
            </div>
            <div class="card">
                ${content}
            </div>
        `;
        contentEl.innerHTML = html;
        badgeEl.textContent = "回顾模式";
      }

      // ========== 切换历史模态框 ==========
      function toggleHistory() {
        if (state.viewMode === "review") {
          exitReview();
          return;
        }
        // 构建历史列表
        let items = [
          { label: "📨 邀请函", key: "invitation" },
          { label: "📋 游戏规则", key: "rules" },
        ];
        // 添加已完成的轮次（从history中获取）
        const historyRounds = state.history.map((h) => h.round);
        // 还要包括当前正在进行的轮次（如果不在history中）
        const currentRound = state.round;
        if (currentRound > 0 && !historyRounds.includes(currentRound)) {
          // 当前轮次还未存入history，但可以查看（只读）
          // 我们允许查看当前轮之前的所有轮次，包括当前轮（但当前轮未完成，可能没有选择线索记录，但仍可查看剧本）
        }
        // 从1到currentRound（含）都加入
        for (let r = 1; r <= currentRound; r++) {
          if (!items.some((item) => item.key === r)) {
            const historyEntry = state.history.find((h) => h.round === r);
            const unlocked = historyEntry ? historyEntry.unlocked : false;
            const label = `第${r}轮${unlocked ? " 🔓" : ""}`;
            items.push({ label, key: r });
          }
        }

        // 显示模态框
        let html = `
            <div class="card" style="background:#fcf9f7;">
                <div class="card-title">📜 历史回顾</div>
                <div class="history-modal">
                    ${items
                      .map(
                        (item) => `
                        <div class="item" onclick="goToReview('${item.key}')">
                            <span>${item.label}</span>
                            <span class="tag">查看</span>
                        </div>
                    `,
                      )
                      .join("")}
                </div>
                <div class="action-bar">
                    <button class="btn btn-secondary" onclick="closeHistory()">关闭</button>
                </div>
            </div>
        `;
        // 在当前内容区域之上叠加显示，或替换内容？为了简单，我们直接替换content，并保留一个关闭按钮。
        // 但为了不丢失当前游戏状态，我们保存当前内容并在关闭时恢复。
        // 由于我们的render是整体的，我们可以用临时显示。
        // 简单方法：直接将模态框插入到content中，但会覆盖原有内容。
        // 我们可以在content中插入模态框，但保留原有内容？由于是单页，我们直接替换并提供一个关闭按钮。
        // 但关闭后需要恢复游戏界面，我们用变量记录是否显示模态框。
        if (state.showHistoryModal) {
          // 已经在显示，则关闭
          state.showHistoryModal = false;
          render();
          return;
        }
        state.showHistoryModal = true;
        // 临时保存当前内容
        const currentHtml = contentEl.innerHTML;
        // 显示模态框，并在关闭时恢复
        let modalHtml = `
            <div class="card" style="background:#fcf9f7;">
                <div class="card-title">📜 历史回顾</div>
                <div class="history-modal">
                    ${items
                      .map(
                        (item) => `
                        <div class="item" onclick="goToReview('${item.key}')">
                            <span>${item.label}</span>
                            <span class="tag">查看</span>
                        </div>
                    `,
                      )
                      .join("")}
                </div>
                <div class="action-bar">
                    <button class="btn btn-secondary" onclick="closeHistory()">关闭</button>
                </div>
            </div>
        `;
        contentEl.innerHTML = modalHtml;
        // 隐藏历史按钮，避免冲突
        // 但保留关闭功能
      }

      function closeHistory() {
        state.showHistoryModal = false;
        render();
      }

      function goToReview(key) {
        state.showHistoryModal = false;
        state.viewMode = "review";
        state.reviewTarget = key;
        render();
      }

      function exitReview() {
        state.viewMode = "game";
        state.reviewTarget = null;
        render();
      }

      // ========== 角色选择页面 ==========
      function renderSelect() {
        let html = `
            <div style="text-align:center;margin-bottom:12px;">
                <p style="font-size:16px;color:#666;">请选择你的角色</p>
                <p style="font-size:13px;color:#999;">点击角色卡进入邀请函</p>
            </div>
            <div class="common-bg">${COMMON_BG}</div>
            <div class="role-select">
                <div class="role-card" onclick="selectRole('han')">
                    <h3>${ROLE_DESCRIPTIONS.han.icon} ${ROLE_DESCRIPTIONS.han.name} <span class="role-title">${ROLE_DESCRIPTIONS.han.title}</span></h3>
                    <div class="full-desc">${ROLE_DESCRIPTIONS.han.desc}</div>
                </div>
                <div class="role-card" onclick="selectRole('shen')">
                    <h3>${ROLE_DESCRIPTIONS.shen.icon} ${ROLE_DESCRIPTIONS.shen.name} <span class="role-title">${ROLE_DESCRIPTIONS.shen.title}</span></h3>
                    <div class="full-desc">${ROLE_DESCRIPTIONS.shen.desc}</div>
                </div>
            </div>
            <p style="font-size:13px;color:#999;text-align:center;">两人面对面，各自用手机选择角色</p>
        `;
        contentEl.innerHTML = html;
        badgeEl.textContent = "选择角色";
      }

      function selectRole(role) {
        state.role = role;
        state.phase = "invitation";
        render();
      }

      // ========== 邀请函页面 ==========
      function renderInvitation() {
        const roleName = state.role === "han" ? "韩伟文" : "沈曼离";
        const content = INVITATIONS[state.role];
        let html = `
            <div class="card">
                <div class="card-title">📨 邀请函 <span class="badge">${roleName}</span></div>
                <div class="invitation-box">${content.replace(/\n/g, "<br>")}</div>
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="goToRules()">我已阅读，下一步</button>
                </div>
            </div>
        `;
        contentEl.innerHTML = html;
        badgeEl.textContent = roleName;
      }

      function goToRules() {
        state.phase = "rules";
        render();
      }

      // ========== 游戏规则页面 ==========
      function renderRules() {
        const roleName = state.role === "han" ? "韩伟文" : "沈曼离";
        let html = `
            <div class="card">
                <div class="card-title">📋 游戏准备 <span class="badge">${roleName}</span></div>
                <div class="rules-box">${GAME_RULES.replace(/\n/g, "<br>")}</div>
                <div class="action-bar">
                    <button class="btn btn-success" onclick="confirmRules()">我已了解，开始游戏</button>
                </div>
            </div>
        `;
        contentEl.innerHTML = html;
        badgeEl.textContent = roleName;
      }

      function confirmRules() {
        state.phase = "playing";
        state.round = 0;
        state.selectedClues = [];
        state.prevSelected = [];
        state.unlockedMap = {};
        state.gameOver = false;
        state.finalAnswer = { killer: "", motive: "", method: "" };
        state.history = [];
        render();
      }

      // ========== 游戏操作函数 ==========
      function toggleClue(id) {
        if (state.viewMode === "review") return; // 回顾模式禁用
        const roundInfo = getCurrentRoundInfo();
        if (!roundInfo) return;
        const idx = state.selectedClues.indexOf(id);
        if (idx > -1) {
          state.selectedClues.splice(idx, 1);
        } else {
          if (state.selectedClues.length < roundInfo.selectCount) {
            state.selectedClues.push(id);
          } else {
            alert(`本轮最多选择 ${roundInfo.selectCount} 条线索`);
          }
        }
        render();
      }

      function confirmClues() {
        if (state.viewMode === "review") return;
        const roundInfo = getCurrentRoundInfo();
        if (!roundInfo) return;
        if (state.selectedClues.length !== roundInfo.selectCount) {
          alert(`请选择 ${roundInfo.selectCount} 条线索`);
          return;
        }
        // 保存本轮历史（在进入下一轮之前）
        saveHistory(roundInfo.round);
        nextRound();
      }

      function saveHistory(roundNumber) {
        // 检查是否已存在记录
        const existing = state.history.find((h) => h.round === roundNumber);
        if (!existing) {
          state.history.push({
            round: roundNumber,
            role: state.role,
            unlocked: state.unlockedMap.hasOwnProperty(roundNumber),
            selectedClues: state.selectedClues.slice(), // 保存选择的线索
          });
        } else {
          // 更新
          existing.unlocked = state.unlockedMap.hasOwnProperty(roundNumber);
          existing.selectedClues = state.selectedClues.slice();
        }
      }

      function nextRound() {
        state.prevSelected = state.selectedClues.slice();
        state.selectedClues = [];
        state.round++;
        const roleData = SCRIPTS[state.role];
        if (state.round >= roleData.length) {
          state.phase = "final";
          render();
          return;
        }
        render();
      }

      function getCurrentRoundInfo() {
        const roleData = SCRIPTS[state.role];
        if (!roleData || state.round >= roleData.length) return null;
        return roleData[state.round];
      }

      function triggerHidden(roundNumber) {
        if (state.viewMode === "review") return;
        const roleData = SCRIPTS[state.role];
        if (!roleData) return;
        const roundInfo = roleData.find((r) => r.round === roundNumber);
        if (!roundInfo) {
          alert("未找到当前轮次信息");
          return;
        }
        if (!roundInfo.hiddenWord) {
          alert("本轮没有隐藏词");
          return;
        }
        if (state.unlockedMap.hasOwnProperty(roundNumber)) {
          alert("这一轮的隐藏线索已经解锁过了！");
          return;
        }
        if (roundInfo.hiddenClue) {
          state.unlockedMap[roundNumber] = roundInfo.hiddenClue;
          alert("✅ 隐藏线索已解锁！请查看下方显示的内容。");
          render();
        } else {
          alert("本轮没有隐藏线索内容，但隐藏词已标记。");
        }
      }

      // ========== 最终指证与真相 ==========
      function renderFinal() {
        let extraHtml = "";
        if (state.prevSelected && state.prevSelected.length > 0) {
          extraHtml = `<div class="clue-detail"><strong>📌 上一轮调查的线索</strong>`;
          state.prevSelected.forEach((id) => {
            const clue = CLUES[id];
            if (clue) {
              extraHtml += `<div style="margin-top:10px;"><strong>${clue.name}</strong><br>${clue.desc}</div>`;
            }
          });
          extraHtml += `</div>`;
          state.prevSelected = [];
        }

        const roleName = state.role === "han" ? "韩伟文" : "沈曼离";
        let html = `
            <div class="card">
                <div class="card-title">🔍 最终指证</div>
                ${extraHtml}
                <p>根据你们调查到的所有线索，请共同指认凶手、动机和作案手法。</p>
                <div class="final-section">
                    <label class="label">凶手是谁？</label>
                    <textarea id="killerInput">${state.finalAnswer.killer}</textarea>
                    <label class="label">动机是什么？</label>
                    <textarea id="motiveInput">${state.finalAnswer.motive}</textarea>
                    <label class="label">作案手法？</label>
                    <textarea id="methodInput">${state.finalAnswer.method}</textarea>
                    <div class="action-bar">
                        <button class="btn btn-success" onclick="submitFinal()">提交指证，查看真相</button>
                    </div>
                </div>
            </div>
        `;
        contentEl.innerHTML = html;
        badgeEl.textContent = roleName;
      }

      function submitFinal() {
        const killer = document.getElementById("killerInput").value.trim();
        const motive = document.getElementById("motiveInput").value.trim();
        const method = document.getElementById("methodInput").value.trim();
        if (!killer || !motive || !method) {
          alert("请完整填写指证内容");
          return;
        }
        state.finalAnswer = { killer, motive, method };
        state.gameOver = true;
        renderTruth();
      }

      function renderTruth() {
