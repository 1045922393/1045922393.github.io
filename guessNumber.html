<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎯 猜数字游戏 · 0-100</title>
    <style>
      /* ===== 全局重置 & 字体 ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(145deg, #1a2634 0%, #0f1419 100%);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        padding: 1.5rem;
      }

      /* ===== 主卡片 ===== */
      .game-container {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 3rem;
        padding: 2.8rem 3.2rem;
        max-width: 580px;
        width: 100%;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: all 0.25s ease;
      }

      /* ===== 标题区 ===== */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 0.8rem;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #f0e9d8, #cfc5b0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .header h1 span {
        font-size: 1.8rem;
        -webkit-text-fill-color: initial;
      }

      .attempt-badge {
        background: rgba(255, 215, 100, 0.15);
        backdrop-filter: blur(4px);
        padding: 0.45rem 1.2rem;
        border-radius: 100px;
        border: 1px solid rgba(255, 215, 100, 0.2);
        font-size: 0.95rem;
        font-weight: 600;
        color: #f5e3b3;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        white-space: nowrap;
      }

      .attempt-badge .count {
        background: #f5e3b3;
        color: #1a2634;
        padding: 0 0.6rem;
        border-radius: 40px;
        font-weight: 700;
        font-size: 1.1rem;
        min-width: 2rem;
        text-align: center;
      }

      /* ===== 范围指示器 ===== */
      .range-indicator {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 60px;
        padding: 0.4rem 1rem;
        margin-bottom: 1.8rem;
        border: 1px solid rgba(255, 255, 255, 0.06);
        font-weight: 500;
        color: #9aa8b9;
        font-size: 0.95rem;
      }

      .range-indicator .range-value {
        font-weight: 700;
        color: #d6e0ed;
        font-size: 1.1rem;
        min-width: 2.2rem;
        text-align: center;
      }

      .range-indicator .range-dash {
        color: #4a5a6e;
        font-weight: 300;
      }

      /* ===== 反馈消息 ===== */
      .message-box {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 2rem;
        padding: 1.4rem 1.8rem;
        margin-bottom: 2rem;
        min-height: 5rem;
        display: flex;
        align-items: center;
        border-left: 4px solid #4a5a6e;
        transition:
          border-color 0.3s ease,
          background 0.3s ease;
      }

      .message-box .emoji {
        font-size: 1.8rem;
        margin-right: 1rem;
        flex-shrink: 0;
      }

      .message-box .msg-text {
        font-size: 1.1rem;
        font-weight: 500;
        color: #e4edf5;
        line-height: 1.4;
        word-break: break-word;
      }

      .message-box .msg-text .highlight {
        color: #f5d78e;
        font-weight: 700;
      }

      /* 不同状态的颜色 */
      .message-box.hint-low {
        border-left-color: #6a8cff;
        background: rgba(106, 140, 255, 0.06);
      }
      .message-box.hint-high {
        border-left-color: #ff7a7a;
        background: rgba(255, 122, 122, 0.06);
      }
      .message-box.hint-win {
        border-left-color: #7ae0a0;
        background: rgba(122, 224, 160, 0.1);
      }
      .message-box.hint-error {
        border-left-color: #ffb347;
        background: rgba(255, 179, 71, 0.06);
      }
      .message-box.hint-start {
        border-left-color: #6c7a8a;
        background: rgba(255, 255, 255, 0.02);
      }

      /* ===== 输入区 ===== */
      .input-group {
        display: flex;
        gap: 0.8rem;
        margin-bottom: 1.2rem;
        flex-wrap: wrap;
      }

      .input-group input {
        flex: 1;
        min-width: 140px;
        padding: 0.9rem 1.4rem;
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        font-size: 1.2rem;
        font-weight: 500;
        color: #f0f4fa;
        outline: none;
        transition: all 0.25s ease;
        backdrop-filter: blur(4px);
      }

      .input-group input::placeholder {
        color: #6b7d8f;
        font-weight: 400;
        font-size: 1rem;
      }

      .input-group input:focus {
        border-color: #f5d78e;
        background: rgba(255, 255, 255, 0.09);
        box-shadow: 0 0 0 4px rgba(245, 215, 142, 0.08);
      }

      .input-group input:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        filter: grayscale(0.3);
      }

      .input-group button {
        padding: 0.9rem 2rem;
        border-radius: 60px;
        border: none;
        font-weight: 600;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        background: linear-gradient(135deg, #f5d78e, #e8c27a);
        color: #1a2634;
        box-shadow: 0 4px 16px rgba(245, 215, 142, 0.2);
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .input-group button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(245, 215, 142, 0.3);
        background: linear-gradient(135deg, #fade9e, #eacb84);
      }

      .input-group button:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: 0 2px 8px rgba(245, 215, 142, 0.2);
      }

      .input-group button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* ===== 底部按钮组 ===== */
      .actions {
        display: flex;
        gap: 0.8rem;
        margin-top: 0.6rem;
        flex-wrap: wrap;
      }

      .actions button {
        flex: 1;
        min-width: 100px;
        padding: 0.7rem 1.2rem;
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: #bcc9d6;
        font-weight: 500;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s ease;
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .actions button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #e4edf5;
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-1px);
      }

      .actions button:active {
        transform: translateY(1px);
      }

      .actions button.btn-restart {
        background: rgba(245, 215, 142, 0.08);
        border-color: rgba(245, 215, 142, 0.15);
        color: #f5d78e;
      }

      .actions button.btn-restart:hover {
        background: rgba(245, 215, 142, 0.16);
        border-color: rgba(245, 215, 142, 0.25);
      }

      /* ===== 历史猜测记录 ===== */
      .history-section {
        margin-top: 1.8rem;
        padding-top: 1.4rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .history-section .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: #7a8b9e;
        font-weight: 500;
        letter-spacing: 0.3px;
        margin-bottom: 0.7rem;
      }

      .history-section .history-header .clear-history {
        background: none;
        border: none;
        color: #6a7d90;
        font-size: 0.8rem;
        cursor: pointer;
        padding: 0.2rem 0.6rem;
        border-radius: 40px;
        transition: all 0.2s ease;
      }

      .history-section .history-header .clear-history:hover {
        color: #e4edf5;
        background: rgba(255, 255, 255, 0.05);
      }

      .history-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        min-height: 2.2rem;
        align-items: center;
      }

      .history-tag {
        background: rgba(255, 255, 255, 0.06);
        padding: 0.25rem 0.8rem;
        border-radius: 40px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #b8c7d8;
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.15s ease;
      }

      .history-tag.tag-low {
        color: #7a9cff;
        border-color: rgba(106, 140, 255, 0.15);
        background: rgba(106, 140, 255, 0.06);
      }

      .history-tag.tag-high {
        color: #ff8a8a;
        border-color: rgba(255, 122, 122, 0.15);
        background: rgba(255, 122, 122, 0.06);
      }

      .history-tag.tag-win {
        color: #7ae0a0;
        border-color: rgba(122, 224, 160, 0.2);
        background: rgba(122, 224, 160, 0.08);
      }

      .history-empty {
        color: #4e5f70;
        font-size: 0.9rem;
        font-style: italic;
      }

      /* ===== 响应式 ===== */
      @media (max-width: 500px) {
        .game-container {
          padding: 1.8rem 1.5rem;
          border-radius: 2rem;
        }

        .header h1 {
          font-size: 1.6rem;
        }

        .header h1 span {
          font-size: 1.4rem;
        }

        .attempt-badge {
          font-size: 0.8rem;
          padding: 0.3rem 0.9rem;
        }

        .input-group input {
          font-size: 1rem;
          padding: 0.75rem 1.2rem;
          min-width: 100px;
        }

        .input-group button {
          font-size: 1rem;
          padding: 0.75rem 1.4rem;
        }

        .message-box {
          padding: 1rem 1.2rem;
          min-height: 4.2rem;
        }

        .message-box .msg-text {
          font-size: 1rem;
        }

        .range-indicator {
          font-size: 0.8rem;
          padding: 0.3rem 0.8rem;
        }
      }

      @media (max-width: 400px) {
        .game-container {
          padding: 1.2rem 1rem;
        }

        .input-group {
          flex-direction: column;
        }

        .input-group button {
          width: 100%;
          justify-content: center;
        }

        .actions {
          flex-direction: column;
        }

        .actions button {
          width: 100%;
        }
      }

      /* ===== 小动画 ===== */
      @keyframes popIn {
        0% {
          transform: scale(0.92);
          opacity: 0.6;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .game-container {
        animation: popIn 0.4s ease-out;
      }

      .history-tag {
        animation: popIn 0.2s ease-out;
      }
    </style>
  </head>
  <body>
    <div class="game-container" role="main" aria-label="猜数字游戏">
      <!-- 标题 & 尝试次数 -->
      <div class="header">
        <h1><span>🎯</span> 猜数字</h1>
        <div class="attempt-badge">
          🧮 次数
          <span class="count" id="attemptCount">0</span>
        </div>
      </div>

      <!-- 范围指示器 -->
      <div class="range-indicator">
        <span class="range-value" id="rangeLow">0</span>
        <span class="range-dash">—</span>
        <span class="range-value" id="rangeHigh">100</span>
      </div>

      <!-- 消息框 -->
      <div class="message-box hint-start" id="messageBox">
        <span class="emoji">💡</span>
        <span class="msg-text" id="messageText">
          输入一个数字，开始挑战吧！
        </span>
      </div>

      <!-- 输入 + 猜测按钮 -->
      <div class="input-group">
        <input
          type="number"
          id="guessInput"
          placeholder="输入 0–100"
          min="0"
          max="100"
          autofocus
          aria-label="输入你猜测的数字"
        />
        <button id="guessBtn">↵ 猜</button>
      </div>

      <!-- 辅助操作 -->
      <div class="actions">
        <button id="newGameBtn" class="btn-restart">🔄 新一局</button>
        <button id="hintBtn">💭 提示</button>
      </div>

      <!-- 历史记录 -->
      <div class="history-section">
        <div class="history-header">
          <span>📋 猜测记录</span>
          <button class="clear-history" id="clearHistoryBtn">清除</button>
        </div>
        <div class="history-tags" id="historyContainer">
          <span class="history-empty">还没有猜测记录</span>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // ===== DOM 引用 =====
        const guessInput = document.getElementById("guessInput");
        const guessBtn = document.getElementById("guessBtn");
        const newGameBtn = document.getElementById("newGameBtn");
        const hintBtn = document.getElementById("hintBtn");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");

        const messageBox = document.getElementById("messageBox");
        const messageText = document.getElementById("messageText");

        const attemptCountEl = document.getElementById("attemptCount");
        const rangeLowEl = document.getElementById("rangeLow");
        const rangeHighEl = document.getElementById("rangeHigh");
        const historyContainer = document.getElementById("historyContainer");

        // ===== 游戏状态 =====
        let secretNumber = 0;
        let attempts = 0;
        let gameOver = false;
        let lowBound = 0;
        let highBound = 100;
        const history = []; // 存储 { guess, result }  result: 'low' | 'high' | 'win'

        // ===== 工具函数 =====
        function getRandomInt(min, max) {
          return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // ===== 更新界面 =====
        function updateUI() {
          // 尝试次数
          attemptCountEl.textContent = attempts;

          // 范围
          rangeLowEl.textContent = lowBound;
          rangeHighEl.textContent = highBound;

          // 输入框状态
          guessInput.disabled = gameOver;
          guessBtn.disabled = gameOver;

          // 如果游戏结束，输入框失焦
          if (gameOver) {
            guessInput.blur();
          } else {
            // 不强制 focus，避免移动端键盘弹出干扰
          }

          // 渲染历史
          renderHistory();
        }

        // ===== 渲染历史记录 =====
        function renderHistory() {
          historyContainer.innerHTML = "";
          if (history.length === 0) {
            const empty = document.createElement("span");
            empty.className = "history-empty";
            empty.textContent = "还没有猜测记录";
            historyContainer.appendChild(empty);
            return;
          }

          // 显示最近的 20 条（倒序，最新的在前）
          const displayHistory = history.slice(-20).reverse();
          for (const item of displayHistory) {
            const tag = document.createElement("span");
            tag.className = "history-tag";

            let label = "";
            if (item.result === "low") {
              tag.classList.add("tag-low");
              label = `⬆ ${item.guess}`; // 猜低了，要往高
            } else if (item.result === "high") {
              tag.classList.add("tag-high");
              label = `⬇ ${item.guess}`; // 猜高了，要往低
            } else if (item.result === "win") {
              tag.classList.add("tag-win");
              label = `🎉 ${item.guess}`;
            } else {
              label = `${item.guess}`;
            }
            tag.textContent = label;
            historyContainer.appendChild(tag);
          }
        }

        // ===== 设置消息 =====
        function setMessage(emoji, text, type) {
          messageText.innerHTML = text;
          // 重置所有类
          messageBox.className = "message-box";
          if (type) {
            messageBox.classList.add(type);
          } else {
            messageBox.classList.add("hint-start");
          }
          // 更新 emoji
          const emojiEl = messageBox.querySelector(".emoji");
          if (emojiEl) emojiEl.textContent = emoji;
        }

        // ===== 检查猜测 =====
        function handleGuess() {
          if (gameOver) {
            setMessage(
              "⛔",
              '游戏已结束，点击 <span class="highlight">“新一局”</span> 再玩一次',
              "hint-error",
            );
            return;
          }

          const rawValue = guessInput.value.trim();
          if (rawValue === "") {
            setMessage("📝", "请输入一个数字", "hint-error");
            guessInput.focus();
            return;
          }

          const guess = Number(rawValue);
          if (!Number.isInteger(guess) || isNaN(guess) || !isFinite(guess)) {
            setMessage("❌", "请输入有效的整数", "hint-error");
            guessInput.value = "";
            guessInput.focus();
            return;
          }

          if (guess < 0 || guess > 100) {
            setMessage(
              "🚫",
              '数字必须在 <span class="highlight">0 到 100</span> 之间',
              "hint-error",
            );
            guessInput.value = "";
            guessInput.focus();
            return;
          }

          // 有效猜测
          attempts++;
          let result = "";
          let msgEmoji = "";
          let msgText = "";
          let msgType = "";

          if (guess === secretNumber) {
            // —— 猜中 ——
            result = "win";
            gameOver = true;
            msgEmoji = "🎉";
            msgText = `太棒了！就是 <span class="highlight">${secretNumber}</span> ！你用了 ${attempts} 次猜中 🏆`;
            msgType = "hint-win";
            setMessage(msgEmoji, msgText, msgType);
            // 更新历史
            history.push({ guess, result });
            updateUI();
            guessInput.value = "";
            // 禁用输入
            guessInput.disabled = true;
            guessBtn.disabled = true;
            // 更新范围显示（固定为最终数字）
            lowBound = secretNumber;
            highBound = secretNumber;
            updateUI();
            // 额外：把胜利标记高亮
            return;
          } else if (guess < secretNumber) {
            result = "low";
            if (guess > lowBound) lowBound = guess;
            msgEmoji = "⬆️";
            msgText = `猜 <span class="highlight">低了</span>，再大一点！ (${lowBound} ~ ${highBound})`;
            msgType = "hint-low";
          } else {
            // guess > secretNumber
            result = "high";
            if (guess < highBound) highBound = guess;
            msgEmoji = "⬇️";
            msgText = `猜 <span class="highlight">高了</span>，再小一点！ (${lowBound} ~ ${highBound})`;
            msgType = "hint-high";
          }

          // 记录历史
          history.push({ guess, result });

          // 更新界面
          updateUI();
          setMessage(msgEmoji, msgText, msgType);
          guessInput.value = "";
          guessInput.focus();

          // 如果范围缩到只剩一个数字（但还没猜中），可给提示
          if (lowBound === highBound && !gameOver) {
            // 理论上此时 lowBound === highBound === secretNumber，但可能因为逻辑问题，我们只做友好提示
            // 但为了安全，不自动猜中
          }
        }

        // ===== 新游戏 =====
        function newGame() {
          secretNumber = getRandomInt(0, 100);
          attempts = 0;
          gameOver = false;
          lowBound = 0;
          highBound = 100;
          history.length = 0; // 清空历史

          guessInput.disabled = false;
          guessBtn.disabled = false;
          guessInput.value = "";
          guessInput.focus();

          updateUI();
          setMessage("💡", "新的一局！输入 0–100 之间的数字", "hint-start");
        }

        // ===== 提示功能 =====
        function giveHint() {
          if (gameOver) {
            setMessage(
              "⏳",
              '游戏已结束，点击 <span class="highlight">“新一局”</span> 重新开始',
              "hint-error",
            );
            return;
          }

          if (history.length === 0) {
            setMessage("🔍", "还没有猜测记录，随便猜一个吧！", "hint-start");
            return;
          }

          // 给出一个合理的建议：取当前范围的中点
          const mid = Math.floor((lowBound + highBound) / 2);
          // 如果中点已经被猜过，稍微偏移
          let suggestion = mid;
          const usedGuesses = new Set(history.map((h) => h.guess));
          if (usedGuesses.has(mid)) {
            // 尝试前后偏移
            for (let offset = 1; offset <= 5; offset++) {
              if (!usedGuesses.has(mid + offset) && mid + offset <= highBound) {
                suggestion = mid + offset;
                break;
              }
              if (!usedGuesses.has(mid - offset) && mid - offset >= lowBound) {
                suggestion = mid - offset;
                break;
              }
            }
            // 如果还是找不到，就取一个范围内的随机数
            if (usedGuesses.has(suggestion)) {
              let tries = 0;
              do {
                suggestion = getRandomInt(lowBound, highBound);
                tries++;
              } while (usedGuesses.has(suggestion) && tries < 50);
            }
          }

          // 确保在范围内
          suggestion = Math.min(Math.max(suggestion, lowBound), highBound);

          setMessage(
            "💭",
            `试试 <span class="highlight">${suggestion}</span> 怎么样？ (${lowBound} ~ ${highBound})`,
            "hint-start",
          );
          guessInput.value = suggestion;
          guessInput.focus();
          guessInput.select();
        }

        // ===== 清除历史 =====
        function clearHistory() {
          if (gameOver) {
            // 如果游戏结束，清空历史但保留胜利记录？
            // 更合理：不清除胜利记录，但清空其他？我们简单实现：只清空历史，但保留状态
            // 但更符合直觉：清空历史记录，但游戏状态不变
            history.length = 0;
            updateUI();
            setMessage("🗑️", "历史记录已清除", "hint-start");
          } else {
            history.length = 0;
            updateUI();
            setMessage("🗑️", "历史记录已清除", "hint-start");
          }
          // 如果有胜利记录，清除历史会丢掉胜利tag，但胜利记录还在？ 我们只清空数组，胜利状态不变
          // 但为了避免混淆，如果游戏结束，清除历史后，胜利tag消失，但游戏还是结束状态。可以。
          // 另外，如果游戏结束，清除历史再新游戏，newGame会重置一切
        }

        // ===== 事件绑定 =====
        guessBtn.addEventListener("click", handleGuess);

        guessInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            handleGuess();
          }
        });

        newGameBtn.addEventListener("click", newGame);

        hintBtn.addEventListener("click", giveHint);

        clearHistoryBtn.addEventListener("click", clearHistory);

        // 点击新游戏时，如果输入框有内容，清空
        newGameBtn.addEventListener("click", function () {
          guessInput.value = "";
        });

        // ===== 初始化 =====
        newGame();

        // 额外优化：输入框自动获取焦点（桌面端）
        if (window.innerWidth > 768) {
          guessInput.focus();
        }

        // 点击容器空白区域聚焦输入框
        document
          .querySelector(".game-container")
          .addEventListener("click", function (e) {
            if (
              e.target === this ||
              e.target.closest(".message-box") ||
              e.target.closest(".range-indicator")
            ) {
              if (!gameOver) {
                guessInput.focus();
              }
            }
          });

        // 防止输入负数或大于100
        guessInput.addEventListener("blur", function () {
          let val = parseInt(this.value, 10);
          if (!isNaN(val)) {
            if (val < 0) this.value = 0;
            if (val > 100) this.value = 100;
          }
        });
      })();
    </script>
  </body>
</html>
