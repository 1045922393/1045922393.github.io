<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>魔法运动员 - Magical Athlete</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      #gameContainer {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #canvas {
        background: linear-gradient(180deg, #f0f8ff 0%, #e6f3ff 100%);
        border-radius: 10px;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        touch-action: none;
      }

      #uiOverlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      .ui-panel {
        position: absolute;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        pointer-events: auto;
        backdrop-filter: blur(10px);
      }

      #playerInfo {
        top: 10px;
        left: 10px;
        max-width: 220px;
      }

      #gameLog {
        bottom: 10px;
        left: 10px;
        max-width: 350px;
        max-height: 180px;
        overflow: hidden;
        font-size: 13px;
        transition:
          max-height 0.3s ease,
          padding 0.3s ease;
      }

      #gameLog.log-collapsed {
        max-height: 45px;
        padding: 8px 15px;
      }

      #gameLog.log-collapsed h4 {
        margin: 0;
        font-size: 12px;
        display: inline-block;
      }

      #logToggleBtn {
        position: static;
        margin-left: 8px;
        background: rgba(102, 126, 234, 0.8);
        color: white;
        border: none;
        padding: 2px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 10px;
        transition: all 0.3s;
        vertical-align: middle;
      }

      #logToggleBtn:hover {
        background: rgba(102, 126, 234, 1);
        transform: scale(1.05);
      }

      #logContent {
        max-height: 140px;
        overflow-y: auto;
        transition: all 0.3s;
        margin-top: 8px;
      }

      #gameLog.log-collapsed #logContent {
        max-height: 20px;
        overflow: hidden;
        margin-top: 3px;
      }

      #gameLog.log-collapsed #logContent div:not(:last-child) {
        display: none;
      }

      #gameLog.log-collapsed #logContent div:last-child {
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #controls {
        top: 10px;
        right: 10px;
        display: flex;
        gap: 10px;
      }

      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .player-card {
        display: flex;
        align-items: center;
        margin: 8px 0;
        padding: 8px;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        border-radius: 8px;
        transition: all 0.3s;
      }

      .player-card:hover {
        transform: translateX(5px);
      }

      .player-token {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        margin-right: 12px;
        border: 3px solid #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      #setupScreen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      #setupPanel {
        background: linear-gradient(135deg, #ffffff 0%, #f0f4f8 100%);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        max-width: 450px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      #setupPanel h2 {
        font-size: 32px;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      #setupPanel p {
        color: #666;
        margin-bottom: 20px;
      }

      .player-select {
        margin: 15px 0;
      }

      .player-select label {
        font-weight: bold;
        color: #333;
      }

      input[type="number"] {
        width: 80px;
        padding: 8px;
        font-size: 18px;
        text-align: center;
        border: 2px solid #667eea;
        border-radius: 8px;
        margin-left: 10px;
      }

      #playerConfig {
        margin-top: 20px;
        text-align: left;
      }

      #playerConfig div {
        margin: 10px 0;
      }

      #playerConfig input[type="text"] {
        padding: 8px 12px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      #playerConfig input[type="text"]:focus {
        border-color: #667eea;
        outline: none;
      }

      #startGame {
        margin-top: 25px;
        padding: 15px 40px;
        font-size: 18px;
      }

      #logContent div {
        padding: 4px 0;
        border-bottom: 1px solid #eee;
        line-height: 1.4;
      }

      #logContent div:last-child {
        border-bottom: none;
      }

      .game-title {
        font-size: 14px;
        font-weight: bold;
        color: #667eea;
        margin-bottom: 5px;
      }

      @media (max-width: 768px) {
        #playerInfo,
        #gameLog {
          max-width: 150px;
          font-size: 11px;
          padding: 10px;
        }

        #controls {
          flex-direction: column;
          gap: 5px;
        }

        button {
          padding: 8px 16px;
          font-size: 12px;
        }

        #setupPanel {
          padding: 20px;
          margin: 10px;
        }

        #setupPanel h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="canvas"></canvas>

      <div id="uiOverlay">
        <div id="playerInfo" class="ui-panel">
          <div class="game-title">🏆 魔法运动员</div>
          <h3>玩家信息</h3>
          <div id="playerList"></div>
        </div>

        <div id="controls" class="ui-panel">
          <button id="rollDice">🎲 掷骰子</button>
          <button id="endTurn">⏭️ 结束回合</button>
        </div>

        <div id="gameLog" class="ui-panel">
          <h4>📜 游戏日志 <button id="logToggleBtn">收起</button></h4>
          <div id="logContent"></div>
        </div>
      </div>

      <div id="setupScreen">
        <div id="setupPanel">
          <h2>🏆 魔法运动员</h2>
          <p>万智牌之父理查·加菲经典桌游</p>

          <div class="player-select">
            <label>玩家人数：</label>
            <input type="number" id="playerCount" min="2" max="6" value="4" />
          </div>

          <div id="playerConfig"></div>

          <button id="startGame">🎮 开始游戏</button>

          <p style="margin-top: 15px; font-size: 12px; color: #999">
            游戏规则：每位玩家组建4人队伍，进行4场比赛<br />
            每场秘密选角参赛，率先冲线者得分！
          </p>
        </div>
      </div>
    </div>

    <script src="MagicAthleteDesktop.js?v=202606091330"></script>
  </body>
</html>
